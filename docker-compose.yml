# 刷题系统 Docker Compose 配置
#
# 无需手动下载代码，也无需 git：
# 容器启动时会自动从 GitHub 下载仓库压缩包，提取其中的 dist-nas 静态站点并交给 nginx 托管。
#
# 启动：docker compose up -d
# 访问：http://localhost:8080
# 自定义端口：PORT=9090 docker compose up -d
# 更新到最新版本：docker compose up -d --force-recreate
#
# GitHub 访问受限时，可通过环境变量替换下载地址（示例使用加速镜像）：
#   PROJECT_TARBALL_URL=https://gh-proxy.com/https://github.com/QQxiaobian/shuatibao/archive/refs/heads/main.tar.gz docker compose up -d

services:
  shuatibao:
    image: nginx:alpine
    container_name: shuatibao
    ports:
      - "${PORT:-8080}:80"
    environment:
      TARBALL_URL: ${PROJECT_TARBALL_URL:-https://github.com/QQxiaobian/shuatibao/archive/refs/heads/main.tar.gz}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ -f /usr/share/nginx/html/.quiz-ready ]; then
          echo "已存在静态文件，跳过下载"
        else
          echo "正在下载刷题系统文件..."
          if [ ! -f /etc/ssl/certs/ca-certificates.crt ]; then
            apk add --no-cache ca-certificates >/dev/null
          fi
          rm -rf /tmp/quiz-src && mkdir -p /tmp/quiz-src
          wget -T 30 -t 3 -O /tmp/quiz.tar.gz "$$TARBALL_URL"
          tar -xzf /tmp/quiz.tar.gz -C /tmp/quiz-src
          SRC=$$(find /tmp/quiz-src -maxdepth 2 -type d -name dist-nas | head -n 1)
          if [ -z "$$SRC" ]; then
            echo "下载包中未找到 dist-nas 目录" >&2
            exit 1
          fi
          rm -rf /usr/share/nginx/html/*
          cp -a "$$SRC/." /usr/share/nginx/html/
          test -f /usr/share/nginx/html/index.html
          touch /usr/share/nginx/html/.quiz-ready
          echo "文件准备完成"
        fi
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
